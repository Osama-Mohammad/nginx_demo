<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>📚 Books</h1>
      <p class="subtitle">Plain HTML/CSS/JS frontend → Node.js API → PostgreSQL</p>
    </header>

    <section class="card">
      <h2>Add a book</h2>
      <form id="book-form">
        <input id="title" type="text" placeholder="Title" required>
        <input id="author" type="text" placeholder="Author" required>
        <input id="year" type="number" placeholder="Year" min="0" max="3000">
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search title or author…">
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th><th></th></tr>
        </thead>
        <tbody id="book-list">
          <tr><td colspan="5" class="muted">Loading…</td></tr>
        </tbody>
      </table>
      <p id="status" class="muted"></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
